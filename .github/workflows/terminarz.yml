name: Aktualizacja terminarza Bayernu

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Aktualizuj terminarz
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          headers = {"X-Auth-Token": os.environ["FOOTBALL_API_KEY"]}
          url = "https://api.football-data.org/v4/teams/5/matches"

          request = urllib.request.Request(url, headers=headers)

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          with open("matches.json", "w", encoding="utf-8") as file:
              json.dump(data, file, ensure_ascii=False, indent=2)

          print("Pobrano mecze Bayernu:", len(data.get("matches", [])))
          PY

      - name: Zapisz terminarz
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          git commit -m "Automatyczna aktualizacja terminarza" || exit 0
          git push
